<section class="rp-card">
  <header class="rp-card-header">
    <div class="rp-card-title-wrap">
      <span class="rp-card-title-icon rp-card-title-icon--purple" aria-hidden="true">
        <mat-icon class="material-icons">dashboard</mat-icon>
      </span>
      <h2 class="rp-card-title">{{ 'home.recent-dashboards' | translate }}</h2>
    </div>
    <a class="rp-card-link" routerLink="/dashboards">{{ 'home.see-all' | translate }}</a>
  </header>

  <div class="rp-card-body" *ngIf="items?.length; else emptyDashboards">
    <a class="rp-dash-row"
       *ngFor="let item of items"
       [routerLink]="['/dashboards', item.id]">
      <span class="rp-dash-icon" aria-hidden="true">
        <mat-icon class="material-icons">grid_view</mat-icon>
      </span>
      <span class="rp-dash-name">
        {{ item.title }}
        <mat-icon *ngIf="item.starred" class="material-icons rp-dash-lock" aria-hidden="true">star</mat-icon>
      </span>
      <span class="rp-dash-time">{{ item.lastVisited | dateAgo:{applyAgo: true} }}</span>
    </a>
  </div>

  <ng-template #emptyDashboards>
    <div class="rp-empty-inline">
      {{ 'dashboard.no-dashboards-text' | translate }}
    </div>
  </ng-template>
</section>
